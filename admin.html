<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060C">
<title>Painel — Cabo Brisa</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#05060C;--roxo-3:#2A2A45;--neon:#B8F04A;--texto:#DCE7F2;--suave:#93A5B8;--coral:#FF6A45;--ciano:#4BE7F0;
--display:"Anton",Impact,sans-serif;--mono:ui-monospace,"Courier New",monospace;--corpo:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--corpo);line-height:1.5;padding:22px 16px 70px}
h1{font-family:var(--display);font-size:26px;text-transform:uppercase;color:var(--neon);letter-spacing:.04em;margin:0 0 18px}
h2{font-family:var(--display);font-size:17px;text-transform:uppercase;color:var(--ciano);letter-spacing:.06em;margin:34px 0 12px}
.bloco{max-width:820px;margin:0 auto}
input,select,textarea,button{font-family:inherit;font-size:14px}
input,select,textarea{background:#0B0C16;border:1px solid var(--roxo-3);border-radius:3px;color:var(--texto);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:none}
button{background:var(--neon);color:#07090E;border:none;border-radius:3px;font-family:var(--mono);font-size:10px;
letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
button.sec{background:transparent;color:var(--neon);border:1px solid var(--neon)}
.linha{display:flex;gap:8px;align-items:center}
.linha input{flex:1}
.cartao{border:1px solid var(--roxo-3);background:#0B0C16;padding:14px;margin-bottom:10px;font-family:var(--mono);font-size:12px}
.cartao .cab{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cartao .cod{font-size:15px;color:var(--neon);letter-spacing:.12em}
.cartao .end{color:var(--suave);font-size:11px;margin-bottom:8px}
.cartao select{width:auto;font-family:var(--mono);font-size:11px;padding:7px 10px}
.chat{border:1px solid var(--roxo-3);background:#0B0C16;padding:14px;margin-bottom:10px}
.chat .cab{display:flex;justify-content:space-between;margin-bottom:8px;font-family:var(--mono);font-size:11px;color:var(--suave)}
.msgs{display:grid;gap:6px;margin-bottom:10px;max-height:220px;overflow-y:auto}
.msg{font-size:13px;padding:7px 10px;border-radius:3px;max-width:88%}
.msg.loja{background:rgba(75,231,240,.1);border:1px solid rgba(75,231,240,.35);justify-self:start}
.msg.cliente{background:rgba(184,240,74,.14);border:1px solid rgba(184,240,74,.4);justify-self:end}
.aviso{font-family:var(--mono);font-size:11px;color:var(--coral);min-height:16px;margin-top:8px}
</style>
</head>
<body>

<div class="bloco">
  <h1>Painel</h1>

  <div class="linha">
    <input id="token" placeholder="Token de admin">
    <button onclick="salvarToken()">Entrar</button>
  </div>
  <p class="aviso" id="msg"></p>

  <h2>Estoque</h2>
  <div class="linha">
    <input id="estMaconha" type="number" min="0" step="1" placeholder="gramas de maconha">
    <input id="estCocaina" type="number" min="0" step="0.5" placeholder="gramas de cocaína">
    <button onclick="salvarEstoque()">Salvar</button>
  </div>

  <h2>Diário</h2>
  <textarea id="diarioTexto" rows="2" maxlength="300" placeholder="chegou lote novo, chuva atrasou as entregas…"></textarea>
  <button style="margin-top:8px" onclick="postarDiario()">Publicar</button>

  <h2>Pedidos</h2>
  <div id="pedidos"></div>

  <h2>Conversas</h2>
  <div id="conversas"></div>
</div>

<script>
var API = 'https://api.cabostore.de';
var token = localStorage.getItem('cb-admin') || '';

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function data(ts) {
  var d = new Date(ts);
  return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function aviso(t) { document.getElementById('msg').textContent = t; }

if (token) document.getElementById('token').value = token;

function salvarToken() {
  token = document.getElementById('token').value.trim();
  localStorage.setItem('cb-admin', token);
  carregar();
}

async function carregar() {
  if (!token) { aviso('Informe o token.'); return; }
  aviso('');
  carregarPedidos();
  carregarConversas();
  try {
    var e = await (await fetch(API + '/api/estado', { cache: 'no-store' })).json();
    document.getElementById('estMaconha').value = e.maconha;
    document.getElementById('estCocaina').value = e.cocaina;
  } catch (err) {}
}

async function salvarEstoque() {
  var corpo = {
    maconha: Number(document.getElementById('estMaconha').value) || 0,
    cocaina: Number(document.getElementById('estCocaina').value) || 0
  };
  var r = await fetch(API + '/api/admin/estoque?admin=' + encodeURIComponent(token), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo)
  });
  aviso(r.ok ? 'Estoque atualizado.' : 'Token inválido.');
}

async function postarDiario() {
  var texto = document.getElementById('diarioTexto').value.trim();
  if (!texto) return;
  var r = await fetch(API + '/api/admin/diario?admin=' + encodeURIComponent(token), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ texto: texto })
  });
  if (r.ok) { document.getElementById('diarioTexto').value = ''; aviso('Publicado.'); }
  else aviso('Token inválido.');
}

async function carregarPedidos() {
  var alvo = document.getElementById('pedidos');
  var r = await fetch(API + '/api/admin/pedidos?admin=' + encodeURIComponent(token), { cache: 'no-store' });
  if (!r.ok) { alvo.innerHTML = '<p class="aviso">Sem acesso.</p>'; return; }
  var lista = await r.json();
  if (!lista.length) { alvo.innerHTML = '<p class="aviso">Nenhum pedido.</p>'; return; }

  var html = '';
  for (var i = 0; i < lista.length; i++) {
    var p = lista[i];
    var end = {};
    try { end = JSON.parse(p.endereco); } catch (e) {}
    html += '<div class="cartao"><div class="cab"><span class="cod">' + esc(p.codigo) + '</span>'
      + '<span>R$ ' + Number(p.total).toFixed(2).replace('.', ',') + ' · ' + data(p.criado_em) + '</span></div>'
      + '<div class="end">' + esc(end.endereco || '—') + '</div>'
      + '<select onchange="mudarStatus(this, \'' + esc(p.codigo) + '\')">';
    var ops = ['aguardando pix', 'pix confirmado', 'motoboy chamado', 'a caminho', 'entregue', 'cancelado'];
    for (var j = 0; j < ops.length; j++) {
      html += '<option value="' + ops[j] + '"' + (ops[j] === p.status ? ' selected' : '') + '>' + ops[j] + '</option>';
    }
    html += '</select></div>';
  }
  alvo.innerHTML = html;
}

async function mudarStatus(sel, codigo) {
  var r = await fetch(API + '/api/admin/status?admin=' + encodeURIComponent(token), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ codigo: codigo, status: sel.value })
  });
  aviso(r.ok ? 'Status de ' + codigo + ' atualizado.' : 'Não deu.');
}

async function carregarConversas() {
  var alvo = document.getElementById('conversas');
  var r = await fetch(API + '/api/chat?admin=' + encodeURIComponent(token), { cache: 'no-store' });
  if (!r.ok) { alvo.innerHTML = '<p class="aviso">Sem acesso.</p>'; return; }
  var lista = await r.json();
  if (!lista.length) { alvo.innerHTML = '<p class="aviso">Nenhuma conversa.</p>'; return; }

  var html = '';
  for (var i = 0; i < lista.length; i++) {
    var c = lista[i];
    html += '<div class="chat"><div class="cab"><span>conversa ' + c.id + ' · ' + data(c.aberta_em) + '</span>'
      + '<button class="sec" onclick="abrirConversa(' + c.id + ')">abrir</button></div>'
      + '<div class="msgs" id="msgs-' + c.id + '"></div>'
      + '<div class="linha"><input id="resp-' + c.id + '" placeholder="responder" onkeydown="if(event.key===\'Enter\')responder(' + c.id + ')">'
      + '<button onclick="responder(' + c.id + ')">Enviar</button></div>'
      + '<p class="aviso" style="font-size:10px">' + esc(c.ultima || '') + '</p></div>';
  }
  alvo.innerHTML = html;
}

async function abrirConversa(id) {
  var alvo = document.getElementById('msgs-' + id);
  var r = await fetch(API + '/api/chat/' + id + '?desde=0', { cache: 'no-store' });
  var lista = await r.json();
  var html = '';
  for (var i = 0; i < lista.length; i++) {
    html += '<div class="msg ' + (lista[i].de === 'loja' ? 'loja' : 'cliente') + '">' + esc(lista[i].texto) + '</div>';
  }
  alvo.innerHTML = html || '<span class="aviso">vazia</span>';
  alvo.scrollTop = alvo.scrollHeight;
}

async function responder(id) {
  var campo = document.getElementById('resp-' + id);
  var texto = campo.value.trim();
  if (!texto) return;
  campo.value = '';
  await fetch(API + '/api/chat/' + id, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ texto: texto, de: 'loja' })
  });
  abrirConversa(id);
}

if (token) carregar();
setInterval(function () { if (token) carregarPedidos(); }, 20000);
</script>

</body>
</html>
